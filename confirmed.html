<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confermata — Enoscrigno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #6B1839;
    color: #F8F5F1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 420px; }
  .icon { width: 84px; margin-bottom: 1.75rem; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 34px;
    margin-bottom: 0.75rem;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #E6D2B4;
    margin-bottom: 2.25rem;
  }
  a.btn {
    display: inline-block;
    background: #B8892A;
    color: #2A1B0A;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 32px;
    border-radius: 30px;
    text-decoration: none;
  }
  .tagline {
    margin-top: 2.5rem;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(230, 210, 180, 0.6);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/enoscrigno-icon-white.png" alt="Enoscrigno" class="icon">
    <h1 id="title">Un attimo…</h1>
    <p id="message">Stiamo verificando il tuo link di conferma.</p>
    <a href="index.html" class="btn">Vai al login</a>
    <div class="tagline">Salva · Ricorda · Degusta · Condividi</div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL      = 'https://xvtbsanxvkshqyeqordp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dGJzYW54dmtzaHF5ZXFvcmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMjY0MjIsImV4cCI6MjEwMDcwMjQyMn0._4YKqsrpBPeCKhFxmCJcIWvep0780H985hCPpWJw-Lg';
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const titleEl = document.getElementById('title');
    const msgEl = document.getElementById('message');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      titleEl.textContent = 'Email confermata!';
      msgEl.textContent = 'Grazie per aver attivato il tuo account. Ti aspettiamo presto su Enoscrigno.';
    } else {
      const { data, error } = await sb.functions.invoke('confirm-email', { body: { token } });
      if (error || data?.error) {
        titleEl.textContent = 'Link non valido';
        msgEl.textContent = (data && data.message) || 'Questo link di conferma non è valido o è scaduto. Puoi richiederne uno nuovo dal tuo profilo dopo l\'accesso.';
      } else {
        titleEl.textContent = 'Email confermata!';
        msgEl.textContent = 'Grazie per aver confermato il tuo indirizzo. Ti aspettiamo presto su Enoscrigno.';
      }
    }
  </script>
</body>
</html>
